<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <!-- Tab Hammer: a hammer whose head is a browser tab. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4C5FD5"/>
      <stop offset="1" stop-color="#2E3A9C"/>
    </linearGradient>
  </defs>
  <rect x="4" y="4" width="120" height="120" rx="28" fill="url(#bg)"/>
  <g transform="rotate(-38 64 64)">
    <!-- handle -->
    <rect x="56" y="50" width="16" height="66" rx="8" fill="#FFC857"/>
    <!-- head: a tab, flat edge down, flared at the base like a browser tab -->
    <path d="M24 56
             C30 56 32 54 32.5 49
             L34 30
             C34.6 23 38 20 44 20
             L84 20
             C90 20 93.4 23 94 30
             L95.5 49
             C96 54 98 56 104 56
             Z" fill="#FFFFFF"/>
  </g>
</svg>
