name: CI

# The jobs below together run exactly `npm run gate` (the local completion gate): `checks` runs
# typecheck, lint, format:check, and the unit tests; the `e2e` shards run build:e2e and the
# Playwright suite. `gate` is the one check to require on main: it passes when both did, or when a
# pull request changes only Markdown (then `checks` and `e2e` are skipped, so a docs PR finishes in
# seconds). Docs-only PRs are detected in the `changes` job rather than with `paths-ignore`,
# because a workflow skipped by a path filter never reports its checks, and a required check that
# never reports blocks the PR forever.
#
# No secrets are used here, and pull requests (forks included) run with a read-only token. Nothing
# deploys from here: releases are the manual Release workflow (release.yml).

on:
  pull_request:
  push:
    branches: [main, dev]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # A newer push to a PR supersedes the run in flight. Pushes to main and dev run to the end.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # main takes only dev: a pull request into main from any other branch, or from a fork, fails
  # here, and the main ruleset requires this check. Skipped (which counts as passing) for pull
  # requests into dev.
  source:
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Only dev merges into main
        env:
          HEAD_REF: ${{ github.head_ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
        run: |
          if [ "$HEAD_REF" != dev ] || [ "$HEAD_REPO" != "$GITHUB_REPOSITORY" ]; then
            echo "::error::Only dev can be merged into main; this pull request is from $HEAD_REPO:$HEAD_REF. Retarget it to dev."
            exit 1
          fi

  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: read
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - id: diff
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          if [ "$GITHUB_EVENT_NAME" != pull_request ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          files=$(gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR/files" --jq '.[].filename')
          echo "$files"
          if [ -n "$files" ] && ! printf '%s\n' "$files" | grep -qv '\.md$'; then
            echo "::notice::Only Markdown changed; skipping checks and e2e."
            echo "code=false" >> "$GITHUB_OUTPUT"
          else
            echo "code=true" >> "$GITHUB_OUTPUT"
          fi

  checks:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm test

  e2e:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: npm
      - run: npm ci

      - name: Playwright version
        id: pw
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      # The e2e fixture launches Playwright's full Chromium (channel 'chromium', new headless),
      # which loads extensions; the headless shell isn't needed. The runner image already has the
      # system libraries Chromium needs (it ships Google Chrome), so there's no apt step.
      - uses: actions/cache@v4
        id: pw-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ steps.pw.outputs.version }}
      - name: Install Playwright Chromium
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install --no-shell chromium
        working-directory: packages/extension

      - run: npm run build:e2e
      - run: npm run test:e2e -- --shard=${{ matrix.shard }}/${{ strategy.job-total }} --repeat-each=10

      - name: Upload Playwright results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results-${{ matrix.shard }}
          path: |
            packages/extension/test-results/
            packages/extension/playwright-report/
          if-no-files-found: ignore
          retention-days: 14

  gate:
    needs: [changes, checks, e2e]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - env:
          CHANGES: ${{ needs.changes.result }}
          CODE: ${{ needs.changes.outputs.code }}
          CHECKS: ${{ needs.checks.result }}
          E2E: ${{ needs.e2e.result }}
        run: |
          echo "changes=$CHANGES code=$CODE checks=$CHECKS e2e=$E2E"
          [ "$CHANGES" = success ] || exit 1
          if [ "$CODE" = true ]; then
            [ "$CHECKS" = success ] && [ "$E2E" = success ]
          else
            [ "$CHECKS" = skipped ] && [ "$E2E" = skipped ]
          fi
