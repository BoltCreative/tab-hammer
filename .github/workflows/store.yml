name: Store upload

# After CI passes on a push to main, builds the Chrome Web Store package and uploads it as the
# item's draft (nothing is submitted for review; that's the Release workflow). Its version is the
# manifest's release version plus main's commit count as a fourth part (0.1.0 -> 0.1.0.57), so
# every upload is above the last without a version-bump commit. Each uploaded commit gets a tag,
# store/<version>. Skipped, with a notice, until the store secrets are set (docs/store/release.md).
#
# Run it by hand (Actions -> Store upload -> Run workflow, on main) to upload main's tip again,
# e.g. after an upload was held back because a review was pending.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# One store call at a time, Release included, in the order they were queued.
concurrency:
  group: chrome-web-store
  cancel-in-progress: false

jobs:
  config:
    # Only pushes to this repo's main (a fork's PR can come from a branch it calls main, so the
    # event and repository are checked too), or a manual run on main.
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      ready: ${{ steps.check.outputs.ready }}
    steps:
      - id: check
        env:
          PUBLISHER: ${{ secrets.CWS_PUBLISHER_ID }}
          ITEM: ${{ secrets.CWS_ITEM_ID }}
          KEY: ${{ secrets.CWS_SERVICE_ACCOUNT_KEY }}
          REFRESH: ${{ secrets.CWS_REFRESH_TOKEN }}
        run: |
          if [ -n "$PUBLISHER" ] && [ -n "$ITEM" ] && { [ -n "$KEY" ] || [ -n "$REFRESH" ]; }; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Chrome Web Store secrets aren't set, so nothing was uploaded. Setup: docs/store/release.md."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi

  upload:
    needs: config
    if: needs.config.outputs.ready == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # the store/<version> tag
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0 # the commit count, and the last store tag

      - name: Decide whether to upload
        id: plan
        env:
          EVENT: ${{ github.event_name }}
        run: |
          skip() { echo "::notice::$1"; echo "go=false" >> "$GITHUB_OUTPUT"; exit 0; }
          # A newer commit on main has its own run coming, with a higher version; uploading this
          # one after it would be refused.
          tip=$(git ls-remote origin refs/heads/main | cut -f1)
          [ "$tip" = "$(git rev-parse HEAD)" ] || skip "main has moved on to ${tip:0:7}; its run uploads instead."
          last=$(git describe --tags --match 'store/*' --abbrev=0 HEAD 2>/dev/null || true)
          if [ "$EVENT" = workflow_run ] && [ -n "$last" ] && \
             ! git diff --name-only "$last" HEAD | grep -qv '\.md$'; then
            skip "Only Markdown changed since $last; nothing to upload."
          fi
          echo "build=$(git rev-list --count HEAD)" >> "$GITHUB_OUTPUT"
          echo "go=true" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        if: steps.plan.outputs.go == 'true'
        with:
          node-version: '22.x'
          cache: npm
      - if: steps.plan.outputs.go == 'true'
        run: npm ci

      - name: Build the store package
        id: build
        if: steps.plan.outputs.go == 'true'
        env:
          TAB_HAMMER_BUILD: ${{ steps.plan.outputs.build }}
        run: |
          npm run build:store
          version=$(node -p "require('./packages/extension/dist-store/manifest.json').version")
          if git rev-parse -q --verify "refs/tags/store/$version" >/dev/null; then
            echo "::notice::$version is already in the store (tag store/$version)."
            echo "go=false" >> "$GITHUB_OUTPUT"
          else
            echo "go=true" >> "$GITHUB_OUTPUT"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Upload the draft
        id: upload
        if: steps.build.outputs.go == 'true'
        env:
          CWS_PUBLISHER_ID: ${{ secrets.CWS_PUBLISHER_ID }}
          CWS_ITEM_ID: ${{ secrets.CWS_ITEM_ID }}
          CWS_SERVICE_ACCOUNT_KEY: ${{ secrets.CWS_SERVICE_ACCOUNT_KEY }}
          CWS_CLIENT_ID: ${{ secrets.CWS_CLIENT_ID }}
          CWS_CLIENT_SECRET: ${{ secrets.CWS_CLIENT_SECRET }}
          CWS_REFRESH_TOKEN: ${{ secrets.CWS_REFRESH_TOKEN }}
          VERSION: ${{ steps.build.outputs.version }}
        run: node packages/extension/scripts/cws.ts upload "packages/extension/release/tab-hammer-$VERSION.zip"

      - name: Tag the uploaded commit
        if: steps.upload.outputs.uploaded == 'true'
        env:
          VERSION: ${{ steps.build.outputs.version }}
        run: |
          git tag "store/$VERSION"
          git push origin "refs/tags/store/$VERSION"
